    <!-- Avant le premier rendu : intro déjà vue ? arrivée par une transition ? (voir js/core/) -->
    <script>
    (function (r) {
        try {
            if (sessionStorage.getItem('cb:intro-seen')) r.classList.add('intro-seen');
            if (sessionStorage.getItem('cb:page-transition') &&
                !matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('pt-enter');
        } catch (e) {}
        r.classList.add('hero-pending');
        // Filet de sécurité si les modules ne se chargent pas.
        setTimeout(function () { r.classList.remove('pt-enter', 'hero-pending'); }, 3500);
    })(document.documentElement);
    </script>
